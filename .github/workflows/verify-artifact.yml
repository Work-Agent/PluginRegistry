name: verify-artifact

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-artifact:
    name: verify-artifact
    runs-on: ubuntu-latest
    steps:
      # 只执行 base 分支的校验脚本，不执行 PR 里的代码。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify changed plugin artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node base/scripts/verify-pr-artifact.mjs
