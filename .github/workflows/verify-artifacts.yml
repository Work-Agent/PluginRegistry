name: verify-artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs --verify-artifacts
