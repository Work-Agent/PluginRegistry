name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      # PR 内容放在 pr/，校验脚本从 base/ 读取，避免 PR 修改校验逻辑。
      - uses: actions/checkout@v7
        with:
          path: pr

      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate PR with trusted base scripts
        if: github.event_name == 'pull_request'
        env:
          REGISTRY_ROOT: ${{ github.workspace }}/pr
        run: node base/scripts/validate.mjs

      - name: Validate main
        if: github.event_name != 'pull_request'
        working-directory: pr
        run: node scripts/validate.mjs
